version: "3.8"
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: qcab
      POSTGRES_PASSWORD: qcab
      POSTGRES_DB: qcab
    ports:
      - "5432:5432"
    volumes:
      - qcab_pg_data:/var/lib/postgresql/data
      - ../qcab_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  qcab_pg_data:
